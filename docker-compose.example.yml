version: "3"

services:
  web:
    # Se construye desde el Dockerfile de este repo. Si publicas tu propia imagen,
    # reemplaza "build" por "image: tu-registro/fedired:tag".
    build: .
    image: fedired-local:latest
    command: bash -c "npm install -g pnpm && pnpm install && npm start"  
    container_name: fedired_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - calcnet
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=3072
    volumes:
      # Monta todo el código fuente en el contenedor
      - ./:/fedired
      # Monta directorios específicos como volúmenes solo si son necesarios
      - ./custom:/fedired/custom:ro
      - ./files:/fedired/files
      - ./.config:/fedired/.config:ro
    healthcheck:
      test: curl -f http://localhost:3000 || exit 1
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    restart: unless-stopped
    image: docker.io/redis:8.10
    container_name: fedired_redis
    networks:
      - calcnet
    volumes:
      - ./redis:/data
    healthcheck:
      test: redis-cli ping
      interval: 5s
      timeout: 5s
      retries: 5

  db:
    restart: unless-stopped
    image: docker.io/groonga/pgroonga:4.1.0-alpine-16-slim
    container_name: fedired_db
    networks:
      - calcnet
    env_file:
      - .config/docker.env
    volumes:
      - ./db:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready --user="$${POSTGRES_USER}" --dbname="$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  calcnet:
