name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Cada lunes a las 05:00 UTC: detecta dependencias rotas y regresiones de Miri
    - cron: "0 5 * * 1"
  workflow_dispatch:

# Solo lectura por defecto; cada job pide lo que necesite
permissions:
  contents: read

# En PRs cancela la ejecución anterior al hacer push nuevo.
# En main no cancela, para que siempre quede el resultado del último commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  # ---------------------------------------------------------------------------
  # Valida los propios workflows (sintaxis, expresiones, acciones inexistentes)
  # ---------------------------------------------------------------------------
  workflow-lint:
    name: Lint workflows (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

  # ---------------------------------------------------------------------------
  # Lint y formato (no modifica archivos: solo falla si hay problemas)
  # ---------------------------------------------------------------------------
  lint-ts:
    name: Lint TypeScript (biome)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Sin --write: el lint de los paquetes (lint:ts) muta archivos, aquí no debe.
      # continue-on-error hasta limpiar los errores existentes (igual que clippy).
      # Cuando el baseline esté limpio, quitar esta línea para que sea bloqueante.
      - name: Biome check
        continue-on-error: true
        run: pnpm exec biome check packages/backend/src packages/client/src packages/fedired-js/src packages/sw/src

  lint-rs:
    name: Lint Rust (fmt + clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check formatting
        run: cargo fmt --all -- --check

      # continue-on-error hasta limpiar los warnings existentes.
      # Cuando el baseline esté limpio, quitar esta línea para que sea bloqueante.
      - name: Clippy
        continue-on-error: true
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ---------------------------------------------------------------------------
  # Compilación: comprueba que todo el monorepo compila (TypeScript, cliente,
  # addon nativo de Rust y las pruebas de Rust). NO ejecuta pruebas y NO
  # necesita PostgreSQL ni Redis: solo compila.
  # ---------------------------------------------------------------------------
  build:
    name: Build (sin base de datos)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Lee la versión de "packageManager" en package.json (pnpm@9.15.0)
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      # Lee la versión de .node-version (26)
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (TypeScript, cliente y addon de Rust)
        env:
          NODE_ENV: production
          NODE_OPTIONS: --max-old-space-size=3072
        run: pnpm run build

      # Compila las pruebas de Rust sin ejecutarlas (no requiere servicios)
      - name: Compile Rust tests
        run: cargo test --workspace --no-run

  # ---------------------------------------------------------------------------
  # Miri: detecta comportamiento indefinido en código Rust unsafe.
  # Solo en la ejecución programada (es lento).
  # ---------------------------------------------------------------------------
  miri:
    name: Miri (scheduled)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Rust nightly with Miri
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: nightly
          components: miri

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: miri

      - name: Install cargo-nextest
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: nextest

      - name: Miri setup
        run: cargo +nightly miri setup

      # Igual que "test:rs:miri" de package.json
      - name: Run Miri
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
        run: cargo +nightly miri nextest run --workspace

  # ---------------------------------------------------------------------------
  # Seguridad
  # ---------------------------------------------------------------------------
  secrets-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (historial completo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Usa el binario oficial de gitleaks (verificado con su checksum). No necesita
      # GITLEAKS_LICENSE: esa licencia solo aplica a la acción gitleaks-action.
      - name: Run gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$ARCHIVE" "$BASE/$ARCHIVE"
          curl -sSfL -o checksums.txt "$BASE/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep -F "  $ARCHIVE" checksums.txt | sha256sum -c -
          tar -xzf "$ARCHIVE" gitleaks
          ./gitleaks detect --source . --redact --no-banner --exit-code 1

  audit:
    name: Dependency audit (pnpm)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Informativo: no bloquea hasta revisar las vulnerabilidades existentes
      - name: Audit production dependencies
        continue-on-error: true
        run: pnpm audit --prod --audit-level=high
